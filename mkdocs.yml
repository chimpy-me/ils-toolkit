site_name: The ILS Toolkit
site_description: Documentation for the tools libraries build on their ILS — CLIs, endpoints, and agent skills
site_url: https://chimpy-me.github.io/ils-toolkit/
repo_url: https://github.com/chimpy-me/ils-toolkit
repo_name: chimpy-me/ils-toolkit
edit_uri: edit/main/docs/

exclude_docs: |
  _template/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Glossary: glossary.md
  - Tools:
      - Sierra:
          - Bulk Holds:
              - Overview: tools/sierra/bulk-holds/index.md
              - Tutorial: tools/sierra/bulk-holds/tutorial.md
              - How-to: tools/sierra/bulk-holds/how-to.md
              - Reference: tools/sierra/bulk-holds/reference.md
              - Explanation: tools/sierra/bulk-holds/explanation.md
              - At CHPL: tools/sierra/bulk-holds/at-chpl.md
  - About:
      - Roadmap: about/roadmap.md
      - Contributing: about/contributing.md
